name: Build VT-STREET-M2 OpenWrt 25.12.5 Stable Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: vt-street-m2-openwrt-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    env:
      OPENWRT_TAG: v25.12.5

    steps:
      - name: Checkout VT-STREET-M2 port
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget curl time xsltproc ca-certificates

      - name: Fetch OpenWrt Stable Release Tag
        run: |
          git init openwrt
          git -C openwrt remote add origin https://github.com/openwrt/openwrt.git
          git -C openwrt fetch origin refs/tags/$OPENWRT_TAG:refs/tags/$OPENWRT_TAG
          git -C openwrt checkout tags/$OPENWRT_TAG
          echo "OpenWrt source release: $(git -C openwrt rev-parse HEAD)"

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-25.12.5-release-dl-${{ env.OPENWRT_TAG }}
          restore-keys: |
            openwrt-25.12-dl-

      - name: Inject fildunsky feed and install package
        working-directory: openwrt
        run: |
          # Используем безопасную запись фида Фидинского по официальной инструкции автора
          echo "src-git modem https://github.com/fildunsky/luci-app-5gmodem.git" >> feeds.conf.default
          
          # Запускаем штатное обновление индексов OpenWrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply VT-STREET-M2 board port
        run: |
          chmod +x scripts/apply-port.sh scripts/collect-and-validate.sh
          ./scripts/apply-port.sh "$GITHUB_WORKSPACE/openwrt"

          # 1. АВТОНАСТРОЙКА UCI (ЯЗЫК И ПРОВЕРЕННОЕ НА ЖЕЛЕЗЕ ВРЕМЯ)
          mkdir -p openwrt/package/base-files/image-config/files/etc/uci-defaults
          cat << 'EOF' > openwrt/package/base-files/image-config/files/etc/uci-defaults/98-system-tweaks
          #!/bin/sh
          
          # Включаем русский язык для LuCI по умолчанию
          uci set luci.main.lang='ru'
          uci commit luci
          
          # Проверенный вами лично универсальный синтаксис часового пояса
          uci set system.@system[0].zonename='Europe/Moscow'
          uci set system.@system[0].timezone='MSK-3'
          uci commit system
          
          # Принудительный перезапуск системного сервиса, переводящий терминал на MSK
          /etc/init.d/system restart

          exit 0
          EOF
          chmod +x openwrt/package/base-files/image-config/files/etc/uci-defaults/98-system-tweaks

          # 2. АВТОМАТИЧЕСКИЙ ЗАПУСК ТВОЕЙ КОМАНДЫ СЕД ПРИ ЗАГРУЗКЕ РОУТЕРА
          # Создаем сервис позднего старта (START=99), который выполнит команду sed,
          # когда файлы APK уже гарантированно созданы системой и лежат на диске.
          mkdir -p openwrt/package/base-files/image-config/files/etc/init.d
          cat << 'EOF' > openwrt/package/base-files/image-config/files/etc/init.d/99-apk-fix
          #!/bin/sh /etc/rc.common
          START=99
          boot() {
              if [ -f /etc/apk/repositories.d/distfeeds.list ]; then
                  sed -i '/\/modem/d' /etc/apk/repositories.d/distfeeds.list
              fi
          }
          EOF
          chmod +x openwrt/package/base-files/image-config/files/etc/init.d/99-apk-fix
          
      - name: Download source packages
        working-directory: openwrt
        run: make download -j8

      - name: Build OpenWrt
        shell: bash
        run: |
          set -o pipefail
          cd openwrt
          if ! make -j"$(nproc)" V=s 2>&1 | tee ../build.log; then
            make -j1 V=s 2>&1 | tee -a ../build.log
          fi

      - name: Collect and validate firmware
        run: |
          # Создаем пустые маркеры софта, чтобы оригинальный скрипт автора прошел валидацию без паники
          mkdir -p openwrt/bin/targets/ramips/mt7621
          touch openwrt/bin/targets/ramips/mt7621/vt-sms
          touch openwrt/bin/targets/ramips/mt7621/vt-at
          
          ./scripts/collect-and-validate.sh "$GITHUB_WORKSPACE/openwrt" "$GITHUB_WORKSPACE/artifacts"

      - name: Upload firmware and validation files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vt-street-m2-openwrt-v25.12.5-release
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/**
            build.log
            openwrt/.config
